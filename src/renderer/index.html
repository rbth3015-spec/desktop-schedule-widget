<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';
                 font-src 'self'; img-src 'self' data:;" />
  <title>일정관리 비서</title>
  <!-- 핸드오프 원본. 값은 여기서만 온다 (design_handoff/tokens.css 그대로) -->
  <link rel="stylesheet" href="styles/fonts-handoff.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="calendar/calendar.css" />
  <link rel="stylesheet" href="todo/todo.css" />
  <link rel="stylesheet" href="todo/timetable.css" />
  <link rel="stylesheet" href="todo/todos.css" />
  <link rel="stylesheet" href="dashboard/dashboard.css" />
  <link rel="stylesheet" href="launcher/launcher.css" />
</head>
<body>
  <div id="widget" class="widget">
    <!-- 드래그 핸들 겸 상단 바 -->
    <header id="titlebar" class="titlebar">
      <div class="titlebar__drag">
        <span class="titlebar__title">일정관리 비서</span>
        <span class="titlebar__rule"></span>
        <span id="titlebar-year" class="titlebar__year"></span>
      </div>
      <div class="titlebar__actions">
        <button id="btn-brief" class="iconbtn" type="button" title="아침 브리핑 다시 보기"></button>
        <button id="btn-search" class="iconbtn" type="button" title="검색"></button>
        <button id="btn-bell" class="iconbtn" type="button" title="알림 기록"></button>
        <button id="btn-lock" class="iconbtn" type="button" title="클릭 통과"></button>
        <span class="titlebar__sep"></span>
        <button id="btn-min" class="iconbtn" type="button" title="최소화"></button>
        <button id="btn-max" class="iconbtn" type="button" title="최대화"></button>
        <button id="btn-close" class="iconbtn iconbtn--danger" type="button" title="트레이로 숨김"></button>
      </div>
    </header>

    <!-- 펼침면 — 왼쪽은 늘 펼쳐진 달력, 오른쪽은 기록면 -->
    <main class="panes">
      <section id="calendar-root" class="pane pane--calendar"></section>
      <div id="splitter" class="splitter" title="드래그해서 비율 조절">
        <span class="splitter__stitch" style="top:8%"></span>
        <span class="splitter__stitch" style="top:22%"></span>
        <span class="splitter__stitch" style="top:36%"></span>
        <span class="splitter__stitch" style="top:50%"></span>
        <span class="splitter__stitch" style="top:64%"></span>
        <span class="splitter__stitch" style="top:78%"></span>
        <span class="splitter__stitch" style="top:92%"></span>
      </div>
      <section id="todo-root" class="pane pane--todo"></section>

      <!-- 책갈피 탭 — 오른쪽 면 바깥으로 삐져나온다 -->
      <div class="tabs">
        <button id="tab-main" class="tab is-on" type="button" title="그날의 시간표와 할 일">하루</button>
        <button id="tab-todos" class="tab" type="button" title="그날그날 적고 지워 나가는 할 일">할 일</button>
        <button id="tab-plan" class="tab" type="button" title="주 · 달 목표와 습관 · 돌아보기">계획</button>
        <button id="tab-settings" class="tab tab--settings" type="button" title="설정">설정</button>
      </div>
    </main>

    <!-- 아래 리본 — D-Day 와 퀵 런처가 한 장에 얹힌다 -->
    <div class="ribbon">
      <!-- Zone C: D-Day 대시보드 -->
      <section id="dash-root" class="zone zone--dash"></section>

      <!-- Zone D: 퀵 런처 도크 -->
      <footer id="launcher-root" class="zone zone--launcher"></footer>
    </div>

    <div id="settings-root" class="settings" hidden></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
